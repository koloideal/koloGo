name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked --all-groups
      - run: just typecheck
