name: Migrations

on:
  push:
    branches: [main]
    paths:
      - "alembic/**"
      - "alembic.ini"
      - "src/kologo/infrastructure/database/**"
      - "src/kologo/infrastructure/config/**"
      - "secret_data/config.example.toml"
      - "uv.lock"
      - ".github/workflows/migrations.yml"
  pull_request:
    paths:
      - "alembic/**"
      - "alembic.ini"
      - "src/kologo/infrastructure/database/**"
      - "src/kologo/infrastructure/config/**"
      - "secret_data/config.example.toml"
      - "uv.lock"
      - ".github/workflows/migrations.yml"

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: upgrade → downgrade → upgrade
    runs-on: ubuntu-latest
    env:
      PG_USER: kologo
      PG_PASSWORD: kologo
      PG_DB: kologo
      KOLOGO_CONFIG: ci-config.toml
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kologo
          POSTGRES_PASSWORD: kologo
          POSTGRES_DB: kologo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Build CI config from example
        run: |
          sed -e "s/^user = \"\"/user = \"$PG_USER\"/" \
              -e "s/^password = \"\"/password = \"$PG_PASSWORD\"/" \
              -e "s/^name = \"kologo\"/name = \"$PG_DB\"/" \
              secret_data/config.example.toml > "$KOLOGO_CONFIG"
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
