[project]
name = "seatbot"
version = "0.1.0"
description = "SeatBot — каршеринг-менеджер поездок из колледжа в Минск: брони, депозит, статистика, чёрный список, VIP."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiogram>=3.22.0",
    "aiogram-dialog>=2.4.0",
    "apscheduler>=3.11.1",
    "asyncpg>=0.30.0",
    "dishka>=1.7.2",
    "orjson>=3.11.8",
    "pillow>=12.3.0",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.44",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "ruff>=0.14.4",
    "watchfiles>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seatbot"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["I001"]

[tool.isort]
line_length = 90

[[tool.mypy.overrides]]
module = ["toml", "apscheduler.*", "aiogram_dialog.*", "dishka.*"]
ignore_missing_imports = true
